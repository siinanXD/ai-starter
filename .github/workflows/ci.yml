name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout private ai-core
        uses: actions/checkout@v4
        with:
          repository: siinanXD/ai-core
          ref: 9fb7f568640346d7ba31eeb6e4d366f6a0e022f1
          path: .deps/ai-core
          token: ${{ secrets.AI_CORE_READ_TOKEN }}
      - name: Install from checked-out ai-core
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/api/pyproject.toml")
          text = path.read_text()
          text = text.replace(
              'ai-core[observe] @ git+https://github.com/siinanXD/ai-core.git@9fb7f568640346d7ba31eeb6e4d366f6a0e022f1',
              "ai-core[observe]",
          )
          path.write_text(text)
          PY
          pip install -e ".deps/ai-core[observe]"
          pip install -e "./apps/api[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout private ai-core
        uses: actions/checkout@v4
        with:
          repository: siinanXD/ai-core
          ref: 9fb7f568640346d7ba31eeb6e4d366f6a0e022f1
          path: .deps/ai-core
          token: ${{ secrets.AI_CORE_READ_TOKEN }}
      - name: Install
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/api/pyproject.toml")
          text = path.read_text()
          text = text.replace(
              'ai-core[observe] @ git+https://github.com/siinanXD/ai-core.git@9fb7f568640346d7ba31eeb6e4d366f6a0e022f1',
              "ai-core[observe]",
          )
          path.write_text(text)
          PY
          pip install -e ".deps/ai-core[observe]"
          pip install -e ./apps/api
          pip install "agent-eval-harness @ git+https://github.com/siinanXD/agent-eval-harness.git@4b2cb9b7839da8970bdbf271769cde41d7258b60"
      - name: Deterministic harness gate
        env:
          PYTHONPATH: apps/api
        run: |
          agent-eval-harness evals/suites/analyze.json \
            --target evals.target:build_target \
            --baseline analyze-baseline \
            --root .evals \
            --label "${{ github.sha }}"
